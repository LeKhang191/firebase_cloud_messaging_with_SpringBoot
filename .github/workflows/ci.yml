name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  autotest:
    name: Autotest on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven

      - name: Run tests
        run: mvn -B test

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-${{ matrix.os }}
          path: target/surefire-reports/

  scripts:
    name: Scripts setup.sh + test.sh on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    env:
      CLEAN_PATH: /usr/bin:/bin:/usr/sbin:/sbin
      FCM_FORCE_PORTABLE_TOOLS: "1"
    steps:
      - uses: actions/checkout@v4

      - name: setup.sh (install portable environment)
        run: env -u JAVA_HOME FCM_FORCE_PORTABLE_TOOLS="$FCM_FORCE_PORTABLE_TOOLS" PATH="$CLEAN_PATH" /bin/bash ./setup.sh

      - name: Verify portable toolchain
        run: |
          test -x .tools/jdk/bin/javac -o -x .tools/jdk/Contents/Home/bin/javac
          test -x .tools/maven/bin/mvn

      - name: test.sh (run autotests with portable tools)
        run: env -u JAVA_HOME FCM_FORCE_PORTABLE_TOOLS="$FCM_FORCE_PORTABLE_TOOLS" PATH="$CLEAN_PATH" /bin/bash ./test.sh

      - name: Upload test reports on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scripts-reports-${{ matrix.os }}
          path: target/surefire-reports/