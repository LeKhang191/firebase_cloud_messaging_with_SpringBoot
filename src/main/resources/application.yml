server:
  port: 8080

spring:
  application:
    name: fcm-demo
  datasource:
    url: jdbc:h2:file:./data/fcmdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      # Off by default: with a public tunnel the console would expose the whole token table.
      enabled: false

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS:file:./firebase-service-account.json}

app:
  # Empty = admin endpoints are open (fine on localhost). Set ADMIN_KEY when sharing the demo via a tunnel.
  admin-key: ${ADMIN_KEY:}
