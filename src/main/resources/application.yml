server:
  port: 8080

spring:
  application:
    name: fcm-demo
  datasource:
    url: jdbc:h2:file:./data/fcmdb
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  h2:
    console:
      enabled: true

firebase:
  credentials-path: ${FIREBASE_CREDENTIALS:file:./firebase-service-account.json}
