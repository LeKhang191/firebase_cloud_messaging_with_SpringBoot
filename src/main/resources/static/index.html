<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FCM Demo - Web Client</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 760px; margin: 24px auto; padding: 0 16px; color: #222; }
    h1 { font-size: 1.4rem; }
    fieldset { margin: 16px 0; border: 1px solid #ccc; border-radius: 8px; }
    legend { font-weight: 600; }
    input { padding: 6px 8px; margin-right: 6px; }
    button { padding: 6px 12px; cursor: pointer; margin: 4px 4px 4px 0; }
    #log { background: #111; color: #9f9; padding: 10px; border-radius: 8px; height: 220px; overflow: auto; font-family: monospace; font-size: 12px; white-space: pre-wrap; }
    code { background: #eee; padding: 1px 4px; border-radius: 4px; word-break: break-all; }
  </style>
</head>
<body>
  <h1>FCM Demo – Spring Boot + Web Push</h1>

  <fieldset>
    <legend>Bước 1: Đăng ký thiết bị (Device Registration)</legend>
    <input id="userId" value="user1" placeholder="userId">
    <button id="btnRegister">Bật thông báo &amp; đăng ký</button>
    <button id="btnUnregister">Hủy đăng ký</button>
    <div>Token: <code id="tokenView">(chưa có)</code></div>
  </fieldset>

  <fieldset>
    <legend>Bước 2: Topic</legend>
    <input id="topic" value="news" placeholder="topic">
    <button id="btnSub">Subscribe</button>
    <button id="btnUnsub">Unsubscribe</button>
  </fieldset>

  <fieldset>
    <legend>Bước 3: Gửi thử (gọi API Spring Boot)</legend>
    <button id="btnSendUser">Gửi cho userId ở trên</button>
    <button id="btnSendTopic">Gửi cho topic ở trên</button>
    <button id="btnOrder">Giả lập đơn hàng đang giao</button>
  </fieldset>

  <div id="log"></div>
  <script src="/firebase-config.js"></script>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
    import { getMessaging, getToken, deleteToken, onMessage } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-messaging.js";

    const $ = (id) => document.getElementById(id);
    const log = (m) => { $('log').textContent += `[${new Date().toLocaleTimeString()}] ${m}\n`; $('log').scrollTop = 1e9; };

    const app = initializeApp(self.FIREBASE_CONFIG);
    const messaging = getMessaging(app);
    let currentToken = null;

    async function api(method, url, body) {
      const res = await fetch(url, {
        method,
        headers: { 'Content-Type': 'application/json' },
        body: body ? JSON.stringify(body) : undefined
      });
      const text = await res.text();
      log(`${method} ${url} -> ${res.status} ${text}`);
      return res;
    }

    $('btnRegister').onclick = async () => {
      try {
        const permission = await Notification.requestPermission();
        if (permission !== 'granted') { log('Người dùng từ chối quyền thông báo'); return; }

        const swReg = await navigator.serviceWorker.register('/firebase-messaging-sw.js');
        currentToken = await getToken(messaging, { vapidKey: self.VAPID_KEY, serviceWorkerRegistration: swReg });
        $('tokenView').textContent = currentToken;
        log('Đã lấy FCM token');

        await api('POST', '/api/devices/register', {
          userId: $('userId').value, token: currentToken, platform: 'web'
        });
      } catch (e) { log('LỖI: ' + e.message); }
    };

    $('btnUnregister').onclick = async () => {
      if (!currentToken) return log('Chưa có token');
      await api('DELETE', '/api/devices?token=' + encodeURIComponent(currentToken));
      await deleteToken(messaging);
      currentToken = null;
      $('tokenView').textContent = '(chưa có)';
    };

    $('btnSub').onclick = () => currentToken
      ? api('POST', '/api/topics/subscribe', { token: currentToken, topic: $('topic').value })
      : log('Chưa có token');

    $('btnUnsub').onclick = () => currentToken
      ? api('POST', '/api/topics/unsubscribe', { token: currentToken, topic: $('topic').value })
      : log('Chưa có token');

    $('btnSendUser').onclick = () => api('POST', '/api/notifications/user/' + encodeURIComponent($('userId').value), {
      title: 'Xin chào', body: 'Thông báo gửi tới user ' + $('userId').value, data: { type: 'TEST' }
    });

    $('btnSendTopic').onclick = () => api('POST', '/api/notifications/topic/' + encodeURIComponent($('topic').value), {
      title: 'Tin mới', body: 'Thông báo gửi tới topic ' + $('topic').value, data: { type: 'NEWS' }
    });

    $('btnOrder').onclick = () => api('POST', '/api/orders/1001/status', {
      userId: $('userId').value, status: 'SHIPPING'
    });

    // Foreground: tab đang mở => trình duyệt KHÔNG tự hiện thông báo, onMessage được gọi
    onMessage(messaging, (payload) => {
      log('FOREGROUND message: ' + JSON.stringify(payload));
      if (payload.notification) {
        new Notification(payload.notification.title, { body: payload.notification.body });
      }
    });
  </script>
</body>
</html>
